<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>월계 한걸음 관리자</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
<div id="adminApp">

  <!-- 로그인 전 화면 -->
  <div id="adminLogin" class="admin-login">
    <h1>월계 한걸음 관리자</h1>
    <p class="sheet-note small">관리자(admin) 권한이 있는 계정으로 로그인하세요.</p>
    <form id="adminLoginForm" novalidate>
      <label for="adminUsername">아이디</label>
      <input id="adminUsername" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
      <label for="adminPassword">비밀번호</label>
      <input id="adminPassword" name="password" type="password" autocomplete="current-password">
      <div class="field-msg" id="adminLoginMsg" role="alert"></div>
      <button class="primary" type="submit">로그인</button>
    </form>
  </div>

  <!-- 로그인 후 화면 -->
  <div id="adminMain" class="admin-main" hidden>
    <header class="admin-header">
      <h1>월계 한걸음 관리자</h1>
      <div class="admin-header-user">
        <span id="adminName"></span>
        <button id="adminLogoutBtn" class="check-btn" type="button">로그아웃</button>
      </div>
    </header>

    <!-- 큰 섹션: 제보 검토 / 신고 관리 -->
    <nav class="admin-tabs admin-section-tabs" id="adminSectionTabs">
      <button class="admin-tab active" data-section="reports" type="button">제보 검토</button>
      <button class="admin-tab" data-section="moderation" type="button">신고 관리<span class="admin-tab-badge" id="modBadge" hidden></span></button>
    </nav>

    <!-- 제보 검토 -->
    <div id="reportsView">
      <nav class="admin-tabs" id="adminTabs">
        <button class="admin-tab active" data-status="pending" type="button">검토 중</button>
        <button class="admin-tab" data-status="approved" type="button">승인됨</button>
        <button class="admin-tab" data-status="rejected" type="button">반려됨</button>
        <button class="admin-tab" data-status="" type="button">전체</button>
      </nav>
      <div class="admin-search-row">
        <input id="adminSearch" type="text" class="admin-search-input" placeholder="제목·설명·제보자·태그로 검색" autocomplete="off">
        <button id="adminSearchClear" type="button" class="admin-search-clear" hidden aria-label="검색어 지우기">✕</button>
      </div>
      <div class="field-msg" id="adminMsg" role="alert"></div>
      <div id="adminList" class="admin-list"></div>
    </div>

    <!-- 신고 관리: 잘못된 정보 신고 / 정보 변경 신고 -->
    <div id="moderationView" hidden>
      <nav class="admin-tabs" id="modTypeTabs">
        <button class="admin-tab active" data-type="flags" type="button">잘못된 정보 신고</button>
        <button class="admin-tab" data-type="change" type="button">정보 변경 신고</button>
      </nav>
      <nav class="admin-tabs" id="modStatusTabs"></nav>
      <div class="field-msg" id="modMsg" role="alert"></div>
      <div id="modList" class="admin-list"></div>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
